# Copy to docker-compose.yml and adjust for your server:
#   cp docker-compose.example.yml docker-compose.yml

services:
  mariadb:
    image: mariadb:11
    container_name: bms_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bms
      MARIADB_USER: bms
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: rootsecret
    volumes:
      - bms_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bms_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Business Management System"
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: bms
      DB_USERNAME: bms
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-168.231.111.10:3000,168.231.111.10:8000,localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://168.231.111.10:3000}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: bms_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_PROXY_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  bms_mariadb_data:
